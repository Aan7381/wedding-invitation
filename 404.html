<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Isti & Adrian — Wedding Invitation</title>
</head>
<body style="margin:0;background:#141510;color:#f5f1e9;display:grid;place-items:center;min-height:100svh;font-family:system-ui,sans-serif">
  <p>Opening invitation…</p>
  <script>
    fetch('./index.html', {cache:'no-store'})
      .then(response => {
        if (!response.ok) throw new Error('Invitation unavailable');
        return response.text();
      })
      .then(html => {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(() => {
        location.href = './';
      });
  </script>
</body>
</html>
